<!doctype html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101114" />
  <meta name="description"
    content="Dividi Aí: controle as despesas do grupo, divida com justiça e descubra quem paga quem. Sem planilhas, sem complicação." />
  <title>Dividi Aí — Divisão de despesas, sem complicação</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/styles.css" />
  <script type="module" src="./js/app.js"></script>
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="sidebar-top">
        <a class="brand" href="./" aria-label="Dividi Aí, início">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 38 38" fill="none">
              <path d="M8 10.5h9.5c5 0 8.5 3.3 8.5 8.5s-3.5 8.5-8.5 8.5H8v-17Z" fill="currentColor" />
              <path d="M18.5 10.5h4.2c4.8 0 8.3 3.5 8.3 8.5s-3.5 8.5-8.3 8.5h-4.2" stroke="currentColor"
                stroke-width="3" />
              <path d="M13 20h12" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" />
            </svg></span>
          <span>dividi<span class="brand-dot">aí</span><sup>®</sup></span>
        </a>
        <nav class="primary-navigation" aria-label="Telas do aplicativo">
        <div class="nav-heading">SEU ESPAÇO</div>
        <button type="button" class="nav-link active" data-view="overview" id="nav-overview"
          aria-label="Visão geral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round">
            <rect x="3" y="3" width="7" height="7" rx="1.3" />
            <rect x="14" y="3" width="7" height="7" rx="1.3" />
            <rect x="3" y="14" width="7" height="7" rx="1.3" />
            <rect x="14" y="14" width="7" height="7" rx="1.3" />
          </svg><span>Visão geral</span></button>
        <button type="button" class="nav-link" data-view="expenses" id="nav-expenses" aria-label="Despesas"><svg
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M8 3h8l3 3v15l-4-2-3 2-3-2-4 2V6l3-3Z" />
            <path d="M9 10h6M9 14h6" />
          </svg><span>Despesas</span></button>
        <button type="button" class="nav-link" data-view="people" id="nav-people" aria-label="Participantes"><svg
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="9" cy="8" r="3" />
            <path d="M3 20v-2c0-3 2.4-5 6-5s6 2 6 5v2M17 5c2 0 4 1.5 4 4s-2 4-4 4M18 15c2.5.3 3 2.4 3 5" />
          </svg><span>Participantes</span></button>
        <button type="button" class="nav-link" data-view="personal" id="nav-personal" aria-label="Meu painel pessoal" title="Meu painel pessoal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>Meu painel</span></button>
        </nav>
        <div class="group-navigation">
        <div class="groups-heading"><span class="nav-heading">SEUS GRUPOS</span><button class="icon-button small"
            data-action="new-group" aria-label="Criar grupo" title="Criar grupo">+</button></div>
        <div id="group-list" class="group-list" aria-label="Grupos"></div>
        <button type="button" class="sidebar-new" data-action="new-group"><span>+</span> Criar novo grupo</button>
        </div>
      </div>
      <div class="sidebar-bottom">
        <div class="local-note"><span class="local-note-icon" aria-hidden="true">↗</span><strong>Simples de
            verdade.</strong>
          <p>Seus dados ficam neste navegador. Sem cadastro, sem anúncios.</p>
        </div>
        <button type="button" class="theme-toggle" data-action="toggle-theme"
          aria-label="Alternar entre tema claro e escuro"><span class="theme-toggle-label"
            id="theme-caption">Aparência</span><span class="theme-toggle-track" aria-hidden="true"><span
              class="theme-toggle-knob"></span></span></button>
        <div class="sidebar-foot">FEITO PARA DIVIDIR. NÃO COMPLICAR.</div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="topbar-path"><span>Meu espaço</span><span class="slash">|</span><strong
            id="topbar-group">Painel</strong><select id="mobile-group-select" class="mobile-group-select"
            aria-label="Selecionar grupo"></select></div>
        <div class="topbar-actions">
          <span class="offline-pill"><span class="status-dot"></span> Salvo neste navegador</span>
          <button class="button ghost topbar-tool" type="button" data-action="export"><svg viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v12m0 0 4-4m-4 4-4-4M4 16v4h16v-4" />
            </svg> Fazer backup</button>
          <button class="icon-button topbar-theme" type="button" data-action="toggle-theme" aria-label="Alternar tema"
            title="Alternar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M20 15.7A8.6 8.6 0 0 1 8.3 4 8.5 8.5 0 1 0 20 15.7Z" />
            </svg></button>
        </div>
      </header>
      <main id="workspace" class="workspace" aria-label="Conteúdo do aplicativo"></main>
      <footer class="app-footer"><span>Dividi Aí <span class="footer-version">| do rolê ao acerto</span></span>
        <div><button class="link-button" data-action="history">Histórico e desfazer</button><span class="footer-separator">·</span><button class="link-button" data-action="import">Importar dados</button><span
            class="footer-separator">·</span><button class="link-button" data-action="export">Exportar
            backup</button><span class="footer-separator">·</span><button class="link-button reset-button"
            data-action="reset">Apagar todos os dados</button>
        </div>
      </footer>
    </div>
  </div>
  <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
    <div id="dialog-body"></div>
  </dialog>
  <input id="import-input" type="file" accept=".json,application/json" hidden />
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>

</html>
